name: Cartoon Studio (your story -> cartoon episode)

# The owner's own story becomes a finished Bengali TV cartoon episode (tvtoon/studio.py: 12 agents, one shared
# episode state, retries, resume, quality control). Start it in either way:
#   1) upload a story as a .txt file into the folder studio/inbox/ (Add file -> Upload files -> Commit): it starts by itself;
#   2) Actions -> this workflow -> Run workflow, with the file name of a story already in studio/inbox/.
# Voices: the normal story mode uses the Gemini voice (GEMINI_TTS_KEY); "test" uses ONLY Chirp (GOOGLE_TTS_KEY).
# Nothing is published. The finished episode folder comes as a downloadable artifact.

on:
  push:
    paths: ["studio/inbox/**.txt"]
  workflow_dispatch:
    inputs:
      story_file:
        description: "a file in studio/inbox/ (e.g. amar_golpo.txt), or studio/acceptance_story.txt for the acceptance test; empty = the newest one"
        default: ""
      voice:
        description: "story = Gemini voice (normal); test = Chirp only; none = subtitles only"
        type: choice
        options: ["story", "test", "none"]
        default: "story"
      portrait:
        description: "also make the 9:16 (portrait) episode"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cartoon-studio
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      ZERO_COST_MODE: "1"
      VOICE_CHOICE: ${{ inputs.voice || 'story' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg, cairo and Python packages
        timeout-minutes: 15
        run: |
          sudo timeout 300 apt-get -o Acquire::Retries=3 update -qq || true
          sudo timeout 300 apt-get -o Acquire::Retries=3 install -y -qq ffmpeg libcairo2-dev pkg-config libraqm0 fonts-dejavu-core > /dev/null 2>&1 || true
          pip install -q numpy scipy opencv-python-headless pillow pycairo fonttools requests

      - name: Keep the voices between runs (no line is spoken twice)
        uses: actions/cache@v4
        with:
          path: work/tvtoon_voices
          key: studio-voices-${{ github.run_id }}
          restore-keys: studio-voices-

      - name: Which story
        id: pick
        run: |
          f="${{ inputs.story_file }}"
          if [ -z "$f" ]; then
            f=$(git diff --name-only HEAD~1 HEAD -- 'studio/inbox/*.txt' 2>/dev/null | tail -1)
            [ -z "$f" ] && f=$(ls -t studio/inbox/*.txt 2>/dev/null | head -1)
          elif [ -f "$f" ]; then
            echo "a story by its path (e.g. studio/acceptance_story.txt - the acceptance test)"
          else
            f="studio/inbox/$(basename "$f")"
          fi
          [ -f "$f" ] || { echo "no story file found in studio/inbox/"; exit 1; }
          echo "file=$f" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$f" .txt)" >> "$GITHUB_OUTPUT"
          echo "Story: $f"

      - name: Produce the episode (12 agents)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_KEY: ${{ env.VOICE_CHOICE == 'story' && secrets.GEMINI_TTS_KEY || '' }}
          GOOGLE_TTS_KEY: ${{ env.VOICE_CHOICE == 'test' && secrets.GOOGLE_TTS_KEY || '' }}
        run: |
          V=gemini; [ "$VOICE_CHOICE" = "test" ] && V=chirp; [ "$VOICE_CHOICE" = "none" ] && V=none
          python -m tvtoon.studio "${{ steps.pick.outputs.file }}" "output/${{ steps.pick.outputs.name }}" --voice $V
          if [ "${{ inputs.portrait }}" = "true" ]; then
            python -m tvtoon.studio "${{ steps.pick.outputs.file }}" "output/${{ steps.pick.outputs.name }}_9x16" --voice $V --portrait
          fi

      - name: Upload the episode folder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cartoon-${{ steps.pick.outputs.name }}-${{ github.run_number }}
          path: |
            output/**
            !output/**/_work/**
          retention-days: 30
