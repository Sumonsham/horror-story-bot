name: Daily Horror Story

on:
  # Started only by cron-job.org (3 hours before each video: 7:00 AM, 10:00 AM and 5:00 PM India time).
  # No GitHub clock any more: GitHub often starts its own timed runs hours late, which then blocked the queue.
  workflow_dispatch:        # "Run workflow" button for tests
    inputs:
      language:
        description: "Force language (hi or bn). Leave empty to alternate."
        required: false
        default: ""
      mode:
        description: "Leave empty. voice_demo = voice sample only. compilation = weekly long video. amavasya = new-moon special."
        required: false
        default: ""
  schedule:                 # v76: ONLY the Saturday-night YouTube Live 'ভূতের রাত' (20:30 India time) - its own queue,
    - cron: "0 15 * * 6"    #      so it never blocks or waits for a story run
  push:                     # ONLY the website (privacy page + ghost map) is updated on a push - never a video
    branches: [main]
    paths:
      - "index.html"
      - "docs/**"
      - ".github/workflows/horror-story.yml"

permissions:
  contents: write

concurrency:                # (a website update never waits for or cancels a video run)
  group: ${{ github.event_name == 'push' && 'horror-website' || (github.event_name == 'schedule' && 'horror-live' || 'horror-story') }}
  cancel-in-progress: false

jobs:
  post:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 360    # 6 hours (the most GitHub allows)
    env:
      USE_FREE_MODEL: ${{ secrets.USE_FREE_MODEL }}   # "1" = also try the slow free on-GitHub voice model
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}   # newest history.json

      - name: Give the bot its git name (every save during the run needs it)
        run: |
          # 9 Nov 2026: files were uploaded to GitHub during the 8 PM run; the bot's save then had to make a new
          # commit, but GitHub's computer had no git name -> "not currently on a branch", the night's history lost
          git config user.name "story-bot"
          git config user.email "story-bot@users.noreply.github.com"

      - name: Make room on the GitHub computer (more disk and memory)
        continue-on-error: true
        timeout-minutes: 8
        run: |
          # 8 Nov 2026 a cartoon run died with "the hosted runner lost communication" (out of room): remove big
          # pre-installed tools this bot never uses, and add extra swap memory
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          SW=/mnt/extra.swap; [ -d /mnt ] && sudo test -w /mnt || SW=/extra.swap
          sudo fallocate -l 8G "$SW" && sudo chmod 600 "$SW" && sudo mkswap "$SW" > /dev/null && sudo swapon "$SW" || echo "extra swap not added"
          free -h | head -3; df -h / | tail -1

      - name: Install video tools and Hindi + Bengali fonts
        timeout-minutes: 15
        run: |
          # 1) ffmpeg straight from GitHub (a ready-made build) - no Ubuntu mirror, so it does not hang there
          mkdir -p "$HOME/ffbin"
          for i in 1 2 3; do
            if curl -fsSL --retry 3 --retry-delay 5 --max-time 240 -o /tmp/ff.tar.xz \
                 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz && \
               tar -xJf /tmp/ff.tar.xz -C /tmp && cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ff* "$HOME/ffbin/"; then
              echo "ffmpeg ready (GitHub build)"; break
            fi
            echo "ffmpeg download slow - trying again ($i)"; sleep 10
          done
          echo "$HOME/ffbin" >> "$GITHUB_PATH"
          # 2) fonts and Bengali/Hindi text shaping: the fonts/ folder in the repo is enough, Ubuntu's packages
          #    are only an extra - if the mirror hangs we simply go on without them
          ( sudo timeout 120 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 update -qq && \
            sudo timeout 180 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 install -y -qq \
              fonts-noto-core libraqm0 libfribidi0 ) > /dev/null 2>&1 || echo "Ubuntu mirror slow - using the repo's fonts"
          # 3) only if the GitHub download failed: Ubuntu's own ffmpeg
          if [ ! -x "$HOME/ffbin/ffmpeg" ]; then
            sudo timeout 300 apt-get -o Acquire::Retries=3 install -y -qq ffmpeg > /dev/null 2>&1 || true
          fi
          export PATH="$HOME/ffbin:$PATH"
          ffmpeg -version | head -1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install -q ephem fonttools requests pillow edge-tts gTTS numpy scipy opencv-python-headless "rembg[cpu]"

      - name: Keep the free voice model saved between runs
        if: env.USE_FREE_MODEL == '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: indic-parler-tts-v1

      - name: Install the free voice model (only when switched on)
        if: env.USE_FREE_MODEL == '1'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            # torch + torchaudio must be the SAME matching CPU versions, installed together first
            pip install -q torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
            pip install -q git+https://github.com/huggingface/parler-tts.git soundfile
            python -c "import torch, torchaudio; from parler_tts import ParlerTTSForConditionalGeneration; print('free voice model ready', torch.__version__)"
          else
            echo "HF_TOKEN not set - free voice model skipped"
          fi

      - name: Make the horror video and post it
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FREEMODEL_API_KEY: ${{ secrets.FREEMODEL_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          PAGE_NAME_HI: ${{ secrets.PAGE_NAME_HI }}
          PAGE_NAME_BN: ${{ secrets.PAGE_NAME_BN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_EXTRA: ${{ secrets.YT_EXTRA }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          GEMINI_TTS_KEY: ${{ secrets.GEMINI_TTS_KEY }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          MAX_IMAGES: ${{ secrets.MAX_IMAGES }}
          TTS_DAY_BUDGET: ${{ secrets.TTS_DAY_BUDGET }}
          TTS_PAID: ${{ secrets.TTS_PAID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          LANGUAGE: ${{ github.event.inputs.language }}
          CHANNEL_LANG: ${{ secrets.CHANNEL_LANG }}
          EVENT: ${{ github.event_name }}
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '30 5 * * 0' && 'compilation') || (github.event.schedule == '25 18 * * *' && 'amavasya') || (github.event.schedule == '0 15 * * 6' && 'live') || '' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}        # (GitHub gives this by itself - for the podcast audio)
          PODCAST_EMAIL: ${{ secrets.PODCAST_EMAIL }}      # (optional - Spotify sends its check code here)
        run: python main.py

      - name: Remember this story
        if: success() && github.event.inputs.mode != 'voice_demo'
        run: |
          git config user.name "story-bot"
          git config user.email "story-bot@users.noreply.github.com"
          BR="${{ github.event.repository.default_branch }}"
          # a save that stopped half-way during the run (9 Nov 2026) is put right first - every file stays as it is
          if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ] || [ -f .git/MERGE_HEAD ] || ! git symbolic-ref -q HEAD > /dev/null; then
            echo "an earlier save had stopped half-way - putting it right"
            OH=""
            for d in rebase-merge rebase-apply; do [ -f ".git/$d/orig-head" ] && OH=$(cat ".git/$d/orig-head"); done
            git rebase --quit 2> /dev/null || true
            git merge --quit 2> /dev/null || true
            git checkout -B "$BR"
            git reset -q
            for f in $(git diff --name-only); do grep -q '^<<<<<<< ' "$f" 2> /dev/null && git checkout -- "$f"; done
            # newest first: files written after the stop stay as they are; then what waited in the stash; then
            # the saves that had not reached GitHub yet
            if git rev-parse -q --verify refs/stash > /dev/null; then
              for f in $(git stash show --name-only 'stash@{0}' 2> /dev/null); do
                git diff --quiet HEAD -- "$f" 2> /dev/null && git checkout 'stash@{0}' -- "$f" 2> /dev/null || true
              done
            fi
            MB=$( [ -n "$OH" ] && git merge-base HEAD "$OH" 2> /dev/null || true )
            if [ -n "$MB" ]; then
              for f in $(git diff --name-only "$MB" "$OH" 2> /dev/null); do
                git diff --quiet HEAD -- "$f" 2> /dev/null && git checkout "$OH" -- "$f" 2> /dev/null || true
              done
            fi
          fi
          # one by one: before, ONE missing file made git skip the whole list (lessons, series memory... never saved)
          for p in history.json next_part.json docs assets/next_up.json assets/lore assets/trends.json assets/lessons.json assets/today_scripts.json assets/teasers.json assets/my_stories.json assets/tts_usage.json assets/series_bible.json assets/ghost_dict.json assets/thumb_b assets/user_thumbs assets/thumb_base assets/title_list.json assets/weekly_report.json assets/podcast.json assets/milestones.json assets/tg_channel.json assets/viewer_voice.json assets/coach.json; do
            if [ -e "$p" ]; then git add -A -f -- "$p" || true; fi
          done
          git commit -q -m "story posted $(date -u +%F_%H%M)" || echo "nothing new to remember"
          for i in 1 2 3; do
            [ -z "$(git log "origin/$BR..HEAD" --oneline 2> /dev/null)" ] && exit 0
            git pull --rebase --autostash -q origin "$BR" || { git rebase --abort 2> /dev/null || true; git pull --no-rebase --no-edit --autostash -X ours -q origin "$BR" || git merge --abort 2> /dev/null || true; }
            git push -q origin "HEAD:$BR" && exit 0
            sleep $((i * 10))
          done
          echo "could not save to GitHub"
          exit 1

      - name: Tell me on Telegram if the run failed
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$TG_TOKEN" ] && exit 0
          if [ -z "$TG_CHAT" ]; then
            TG_CHAT=$(curl -s "https://api.telegram.org/bot$TG_TOKEN/getUpdates" | python3 -c "import sys,json; r=json.load(sys.stdin).get('result',[]); print(r[-1]['message']['chat']['id'] if r and 'message' in r[-1] else '')")
          fi
          WHY="run মাঝপথে থেমে গেছে (সম্ভবত ৬ ঘণ্টার সময় শেষ, বা GitHub-এর install সমস্যা) - পরের run-এ সাধারণত নিজে ঠিক হয়"
          [ -f fail_reason.txt ] && WHY=$(cat fail_reason.txt)
          [ -n "$TG_CHAT" ] && curl -s "https://api.telegram.org/bot$TG_TOKEN/sendMessage" -d chat_id="$TG_CHAT" --data-urlencode text="❌ ভূতের bot-এর run আটকে গেছে।
          কারণ: $WHY
          বিস্তারিত: $RUN_URL" > /dev/null || true

      - name: Keep a copy of the video (3 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horror-video
          path: |
            work/final.mp4
            work/thumbnail.jpg
            work/story.json
            work/voice_demo_*.mp3
          retention-days: 3
          if-no-files-found: ignore

  # The website on GitHub Pages: the privacy page (index.html, needed for the YouTube permission) stays at the
  # main address, the ghost map (docs folder) is at .../map/. Settings > Pages > Source must be "GitHub Actions".
  # (GitHub never rebuilds a "Deploy from a branch" site for the bot's own commits - so the map is published here.)
  site:
    needs: post
    if: always() && github.event.inputs.mode != 'voice_demo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}   # with the map the bot has just saved

      - name: Put the website together (privacy page + ghost map)
        run: |
          mkdir -p _site/map
          if [ -f index.html ]; then cp index.html _site/index.html; else echo "no privacy page (index.html)"; fi
          if [ -d docs ]; then cp -r docs/. _site/map/; else echo "no map yet - the bot makes it on its next run"; fi
          ls -la _site _site/map

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publish the website
        id: deployment
        uses: actions/deploy-pages@v4
