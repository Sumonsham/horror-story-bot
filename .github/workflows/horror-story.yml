name: Daily Horror Story

on:
  schedule:
    # The main start comes from cron-job.org at 11:55 AM and 7:55 PM India time (videos out ~1 PM and ~9 PM).
    # These GitHub times are only a backup - they post nothing if the video is already out.
    - cron: "10 7 * * *"    # backup ~12:40 PM India time
    - cron: "10 15 * * *"   # backup ~8:40 PM India time
    - cron: "30 5 * * 0"    # Sunday 11:00 AM India time: weekly long compilation video
    - cron: "25 18 * * *"   # 11:55 PM India time: Amavasya midnight special (only on new-moon nights)
  workflow_dispatch:        # "Run workflow" button for tests
    inputs:
      language:
        description: "Force language (hi or bn). Leave empty to alternate."
        required: false
        default: ""
      mode:
        description: "Leave empty. voice_demo = voice sample only. compilation = weekly long video. amavasya = new-moon special."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: horror-story
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}   # newest history.json

      - name: Install video tools and Hindi + Bengali fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core libraqm0 libfribidi0 > /dev/null

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install -q requests pillow edge-tts gTTS numpy scipy opencv-python-headless "rembg[cpu]"

      - name: Make the horror video and post it
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID_2: ${{ secrets.CF_ACCOUNT_ID_2 }}
          CF_API_TOKEN_2: ${{ secrets.CF_API_TOKEN_2 }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          PAGE_NAME_HI: ${{ secrets.PAGE_NAME_HI }}
          PAGE_NAME_BN: ${{ secrets.PAGE_NAME_BN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_EXTRA: ${{ secrets.YT_EXTRA }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          GEMINI_TTS_KEY: ${{ secrets.GEMINI_TTS_KEY }}
          GEMINI_TTS_KEY_2: ${{ secrets.GEMINI_TTS_KEY_2 }}
          GEMINI_TTS_KEY_3: ${{ secrets.GEMINI_TTS_KEY_3 }}
          LANGUAGE: ${{ github.event.inputs.language }}
          EVENT: ${{ github.event_name }}
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '30 5 * * 0' && 'compilation') || (github.event.schedule == '25 18 * * *' && 'amavasya') || '' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Remember this story
        if: success() && github.event.inputs.mode != 'voice_demo'
        run: |
          git config user.name "story-bot"
          git config user.email "story-bot@users.noreply.github.com"
          git add history.json
          git add -A next_part.json 2>/dev/null || true
          git commit -m "story posted $(date -u +%F_%H%M)" || exit 0
          git pull --rebase -q || true
          git push -q

      - name: Tell me on Telegram if the run failed
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$TG_TOKEN" ] && exit 0
          if [ -z "$TG_CHAT" ]; then
            TG_CHAT=$(curl -s "https://api.telegram.org/bot$TG_TOKEN/getUpdates" | python3 -c "import sys,json; r=json.load(sys.stdin).get('result',[]); print(r[-1]['message']['chat']['id'] if r and 'message' in r[-1] else '')")
          fi
          [ -n "$TG_CHAT" ] && curl -s "https://api.telegram.org/bot$TG_TOKEN/sendMessage" -d chat_id="$TG_CHAT" --data-urlencode text="❌ Horror bot run failed. Open: $RUN_URL" > /dev/null || true

      - name: Keep a copy of the video (3 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horror-video
          path: |
            work/final.mp4
            work/thumbnail.jpg
            work/story.json
            work/voice_demo_*.mp3
          retention-days: 3
          if-no-files-found: ignore
